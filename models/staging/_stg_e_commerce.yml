models:
  - name: stg_olist_customers_dataset__customers
    description: "{{ doc('customer_table') }}"
    columns:
      - name: customer_id
        description: unique id representing each customer, this is the primary key.
        data_tests:
          - unique
          - not_null
      - name: customer_unique_id
        description: unique identifier of a customer. column is not unique but has no nulls.
        data_tests:
          - not_null

  - name: stg_olist_order_items_dataset__orders
    description: Raw data representing order information. The table doesn't appear to have a primary key, so additional checks may be required.
    columns:
      - name: order_item_id
        data_tests:
          - not_null
      - name: order_id
        data_tests:
          - not_null
      - name: seller_id
        data_tests:
          - not_null

  - name: stg_olist_order_payments_dataset__payments
    description: Raw file representing payment information. This table doesn't have a column with unique values.
    columns:
      - name: order_id
        data_tests:
          - not_null

  - name: stg_olist_sellers_dataset__merchants
    description: Raw file representing seller information. This table doesn't have a column with unique values.
    columns:
      - name: seller_id
        description: this column represents each unique seller with a unique primary key
        data_tests:
          - not_null
          - unique

  - name: stg_olist_orders_dataset__orders
    description: Raw file representing order information.
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique
